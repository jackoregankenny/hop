# Pushing a tag like v0.3.0 builds both apps, runs the self-tests and publishes a GitHub Release
# with Rayfast.zip, Tiles.zip and their SHA-256 checksums. The apps update from these releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: ./build.sh test
      - name: Build release
        run: ./build.sh dist "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
