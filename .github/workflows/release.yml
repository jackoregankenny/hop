# Pushing a tag like v0.3.0 builds Hop, runs the self-test and publishes a GitHub Release
# with Hop.zip and its SHA-256 checksum. The app updates from these releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26   # Xcode 26: Liquid Glass needs the macOS 26 SDK
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: ./build.sh test
      - name: Build release
        run: ./build.sh dist "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
